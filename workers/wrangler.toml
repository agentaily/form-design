name = "form-design-api"
main = "src/index.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]

# D1 — the owner-config feature needs it. Provisioned in prod via
# `wrangler d1 create form-design-db` (yarnbcoder account, APAC). Under
# vitest-pool-workers the binding runs against a local miniflare D1, so the id
# only matters for real deploys. The Worker reads it as `env.DB`.
[[d1_databases]]
binding = "DB"
database_name = "form-design-db"
database_id = "9666fb73-cf26-471c-b159-a08e42f94762"
# Schema 演进走 wrangler D1 迁移：migrations/*.sql 由 `wrangler d1 migrations apply`
# 按序、幂等应用（追踪表 d1_migrations）。deploy-workers.yml 在每次部署前自动 apply。
# 一次性数据 backfill 不在此目录（见 runbooks/，手动 runbook）。
migrations_dir = "migrations"

# CONFIG_KEY (AES-GCM master key for encrypting owner secrets) is set via
# `wrangler secret put CONFIG_KEY` in prod, never committed. For tests it's
# injected as a miniflare binding in vitest.config.ts (a throwaway 256-bit key).
