name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prettier --check .
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # CI has no system Chrome → use Playwright's bundled chromium.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PW_USE_BUNDLED: "1"

  # workers/ is an independent npm subpackage (Cloudflare Workers backend) with
  # its own lockfile, typecheck, and vitest (real workerd via
  # @cloudflare/vitest-pool-workers). Gate it on every PR — no path filter — so
  # it always reports status for branch protection.
  workers:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
