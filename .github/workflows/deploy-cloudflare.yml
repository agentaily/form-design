name: Deploy to Cloudflare Pages

on:
  # Auto-deploy on every push to main (first manual run succeeded 2026-06-11).
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One concurrent deploy; newer runs cancel in-flight ones.
concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Cloudflare Pages serves from the root domain, so build with base "/".
      - run: npm run build
        env:
          DEPLOY_BASE: "/"
          # Frontend (form-design.agentaily.com) calls the Workers backend
          # cross-origin; backend CORS whitelists this origin. See OPERATIONS §12.
          VITE_API_BASE: "https://form-design-api.agentaily.workers.dev"
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=form-design --branch=main
